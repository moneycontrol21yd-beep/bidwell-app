name: Brain Category Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install huggingface_hub psycopg2-binary
      - name: Run update
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python scripts/update_brain.py
